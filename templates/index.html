<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>High Card Duel</title><link rel="stylesheet" href="/static/style.css"><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script></head><body><main><header><button id="backBtn">←</button><div><b>HIGH CARD DUEL</b><small id="connection">CONNECTING...</small></div><span>ROUND <i id="roundNo">1</i></span></header><section id="homeScreen" class="screen active"><div class="box"><div class="logo">HCD</div><h2>1V1 CARD DUEL</h2><p>Find another player and reveal one card each.</p><button id="findBtn" class="primary">FIND OPPONENT</button><p id="homeStatus">Ready</p></div></section><section id="searchScreen" class="screen"><div class="box"><div class="spin"></div><h2>SEARCHING...</h2><p id="searchStatus">Looking for another player</p><button id="cancelBtn">CANCEL</button></div></section><section id="arenaScreen" class="screen"><div id="arenaStatus" class="bar">Preparing duel...</div><div id="countdown" class="count"></div><div class="players"><div><label>OPPONENT</label><small id="opponentNo">PLAYER 1</small><div id="opponentCard" class="card back">HCD</div></div><div class="vs">VS</div><div><label>YOU</label><small id="youNo">PLAYER 2</small><div id="yourCard" class="card back">HCD</div></div></div><p class="hint">Cards are revealed automatically.</p></section><section id="resultScreen" class="screen"><div id="resultIcon" class="resultIcon">✓</div><h2 id="resultTitle">YOU WIN</h2><p id="resultSub"></p><div class="resultCards"><div><small>OPPONENT</small><div id="resultOppCard" class="card"></div></div><div><small>YOU</small><div id="resultYourCard" class="card"></div></div></div><button id="playAgainBtn" class="primary">PLAY AGAIN</button></section></main><script src="/static/main.js"></script></body></html>
